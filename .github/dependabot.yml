version: 2

# Weekly update PRs. Each one runs CI like any other pull request, so a
# dependency bump that breaks the build is visible before it is merged.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
