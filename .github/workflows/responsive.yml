name: Responsive

# The whole responsive sweep (tests/e2e/responsive.spec.js with RESPONSIVE_FULL=1): every screen at every
# window size, light and dark, 200% zoom, on Chromium and WebKit. Pull requests run only the smoke sizes
# (the e2e job in ci.yml); this runs the rest every night.
#
# Run it by hand with "update_snapshots" ticked to make new screenshot baselines: they are uploaded as the
# responsive-baselines artifact, to unzip into tests/e2e/__screenshots__, review and commit.

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 02:00 in Manila
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Write new screenshot baselines instead of comparing against them"
        type: boolean
        default: false

concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive:
    name: Responsive sweep (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_DATABASE: mentora_e2e
      E2E_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
          tools: composer

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # The pages load the built CSS and JS.
      - name: Build Vite assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-cw-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run the responsive sweep
        env:
          RESPONSIVE_FULL: "1"
          UPDATE_FLAG: ${{ inputs.update_snapshots && '--update-snapshots=all' || '' }}
        run: npx playwright test responsive.spec.js $UPDATE_FLAG

      # Even when some checks fail, so the baselines that were written can still be reviewed.
      - name: Upload the new baselines
        if: always() && inputs.update_snapshots == true
        uses: actions/upload-artifact@v7
        with:
          name: responsive-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: error

      - name: Show the app's own errors
        if: failure()
        run: tail -n 80 writable/logs/log-*.log 2>/dev/null || echo "no app log written"

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            writable/logs/
          if-no-files-found: ignore
