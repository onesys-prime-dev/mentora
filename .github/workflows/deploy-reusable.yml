name: Deploy (reusable)

# The deploy itself, shared by the staging and production workflows
# (deploy.yml and deploy-production.yml). It is not started directly: a caller
# passes the name of a GitHub Environment and this job runs inside it, so it
# uses that environment's secrets and variables, and its protection rules
# (for example "required reviewers" on production) pause the job before any
# step runs. Setup guide: docs/github-environments.md.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (staging or production)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04

    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}

    # Two deploys must never run at the same time against the same server folder.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    # Settings come from the environment's variables. DEPLOY_PATH and SITE_URL
    # have no fallback in either environment on purpose: a missing value stops
    # the deploy (see "Check this environment is configured") rather than
    # guessing a folder on a server shared with other sites.
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php8.5' }}
      # Where the question-builder worker lives on the server. Empty: the worker is not deployed from here.
      QB_PATH: ${{ vars.QB_PATH || '' }}
      # The worker's systemd unit. One per environment on the shared VPS.
      QB_SERVICE: ${{ vars.QB_SERVICE || format('mentora-qb-worker-{0}', inputs.environment) }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '' }}
      SITE_URL: ${{ vars.SITE_URL || '' }}
      # Staging uses a self-signed certificate, so its checks skip certificate
      # verification. Production must have a real one; set TLS_INSECURE=true
      # there only knowingly.
      TLS_INSECURE: ${{ vars.TLS_INSECURE || (inputs.environment == 'staging' && 'true' || 'false') }}
      SERVER_HOST: ${{ secrets.VPS_HOST }}
      REMOTE: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}

    steps:
      ########################################################
      # Is this environment set up?
      ########################################################

      # Nothing has touched the server yet. Fails with a plain message when a
      # value is missing, instead of an obscure SSH or rsync error later.
      - name: Check this environment is configured
        env:
          HAS_KEY: ${{ secrets.VPS_PRIVATE_KEY != '' }}
          HAS_USER: ${{ secrets.VPS_USERNAME != '' }}
          HAS_HOST: ${{ secrets.VPS_HOST != '' }}
        run: |
          missing=""
          [ "$HAS_KEY" = "true" ]  || missing="$missing secret:VPS_PRIVATE_KEY"
          [ "$HAS_USER" = "true" ] || missing="$missing secret:VPS_USERNAME"
          [ "$HAS_HOST" = "true" ] || missing="$missing secret:VPS_HOST"
          [ -n "$DEPLOY_PATH" ]    || missing="$missing variable:DEPLOY_PATH"
          [ -n "$SITE_URL" ]       || missing="$missing variable:SITE_URL"
          if [ -n "$missing" ]; then
            echo "::error::The '$DEPLOY_ENV' environment is missing:$missing. Add them under Settings > Environments > $DEPLOY_ENV (see docs/github-environments.md). Nothing was deployed."
            exit 1
          fi
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::SITE_URL must start with https:// (it is '$SITE_URL')."; exit 1 ;;
          esac
          if [ "$DEPLOY_ENV" = "production" ] && [ "$TLS_INSECURE" = "true" ]; then
            echo "::warning::TLS_INSECURE is true on production, so the health and smoke checks do not verify the certificate."
          fi
          echo "Deploying to $DEPLOY_ENV: $SITE_URL"

          if [ "$TLS_INSECURE" = "true" ]; then
            echo "CURL_TLS=-k" >> "$GITHUB_ENV"
            echo "SMOKE_TLS=--insecure" >> "$GITHUB_ENV"
          fi
          echo "HEALTH_URL=${SITE_URL%/}/health" >> "$GITHUB_ENV"

      ########################################################
      # Checkout
      ########################################################

      - name: Checkout repository
        uses: actions/checkout@v7

      ########################################################
      # PHP (8.5: the version the site's PHP-FPM runs)
      ########################################################

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, mysqli, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      ########################################################
      # NODE
      ########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # npm ci installs exactly what package-lock.json says (the CI workflow
      # proves this works on Linux).
      - name: Install Node dependencies
        run: npm ci

      ########################################################
      # Build
      ########################################################

      - name: Build Vite assets
        run: npm run build

      - name: Verify build output
        run: test -f public/build/.vite/manifest.json

      ########################################################
      # SSH
      ########################################################

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_PRIVATE_KEY }}

      # With the VPS_KNOWN_HOSTS secret set, the server's identity is checked
      # strictly. Without it the first connection is accepted blindly (a
      # warning is shown); see docs/deploy.md for how to add the secret.
      - name: Trust the server's SSH host key
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Only the key itself ("ssh-ed25519 AAAA...") is taken from the
          # secret and paired with VPS_HOST, so it works whether the secret
          # holds a host name, an IP, or a whole ssh-keyscan line.
          key=$(printf '%s\n' "$KNOWN_HOSTS" | awk '/ssh-ed25519/ { print $(NF-1), $NF; exit }')
          if [ -n "$key" ]; then
            printf '%s %s\n' "$SERVER_HOST" "$key" > ~/.ssh/known_hosts
            echo "SSH_OPTS=-p ${SSH_PORT} -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set for $DEPLOY_ENV, so the server's identity is not verified. See docs/deploy.md."
            echo "SSH_OPTS=-p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          fi

      ########################################################
      # Safety checks on the server (before anything is changed)
      ########################################################

      - name: Check the deploy folder is the live app
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE_SCRIPT'
          set -euo pipefail
          dir="$1"
          if [ ! -d "$dir" ] || [ ! -f "$dir/.env" ] || [ ! -d "$dir/writable" ]; then
            echo "::error::$dir does not look like the live Mentora folder (it needs .env and writable/). Refusing to deploy."
            exit 1
          fi
          command -v "$2" > /dev/null || { echo "::error::$2 was not found on the server."; exit 1; }
          REMOTE_SCRIPT

      - name: Back up the database
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          get() { grep -E "^$1[[:space:]]*=" .env | head -1 | sed 's/^[^=]*=[[:space:]]*//' | tr -d "'\""; }
          DBH=$(get database.default.hostname)
          DBN=$(get database.default.database)
          DBU=$(get database.default.username)
          DBP=$(get database.default.password)
          mkdir -p "$HOME/backups"
          file="$HOME/backups/deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
          MYSQL_PWD="$DBP" mysqldump --no-tablespaces -h "$DBH" -u "$DBU" \
            --single-transaction --routines --triggers "$DBN" | gzip > "$file"
          # mysqldump writes this line only when the dump finished.
          if ! zcat "$file" | tail -2 | grep -q "Dump completed"; then
            rm -f "$file"
            echo "::error::The database backup did not complete. Nothing was deployed."
            exit 1
          fi
          echo "Backup saved: $file ($(du -h "$file" | cut -f1))"
          # Keep the 10 most recent deploy backups.
          ls -1t "$HOME"/backups/deploy-*.sql.gz | tail -n +11 | xargs -r rm -f
          REMOTE_SCRIPT

      ########################################################
      # Deploy
      ########################################################

      # The leading "/" on each exclude limits it to the project root; without
      # it a rule such as "tests" also matched folders inside vendor/.
      - name: Deploy application
        run: |
          rsync -az --delete \
            --exclude="/.git" \
            --exclude="/.github" \
            --exclude="/.env" \
            --exclude="/node_modules" \
            --exclude="/tests" \
            --exclude="/writable" \
            --exclude="/python-question-builder-service" \
            --exclude="/docs" \
            --exclude="/builds" \
            --exclude="/.claude" \
            --exclude="/env" \
            --exclude="/phpunit.dist.xml" \
            -e "ssh $SSH_OPTS" \
            ./ \
            "$REMOTE:$DEPLOY_PATH"

      ########################################################
      # Question-builder worker: code (optional)
      ########################################################

      # Only when QB_PATH is set. The unit and its secrets file are placed once
      # by someone with root (python-question-builder-service/deploy/); this
      # step only copies the code and installs its libraries. The running worker
      # keeps the old code until "Restart the question-builder worker", which
      # runs after the migrations. It never fails the deploy: the website does
      # not depend on the worker.
      - name: Update the question-builder worker's code
        if: env.QB_PATH != ''
        run: |
          rsync -az --delete \
            --exclude="/venv" --exclude="/tests" --exclude="/eval" --exclude="/.env" \
            --exclude="__pycache__" --exclude="*.log" \
            -e "ssh $SSH_OPTS" \
            python-question-builder-service/ \
            "$REMOTE:$QB_PATH/" || { echo "::warning::The worker code could not be copied."; exit 0; }
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$QB_PATH" <<'REMOTE_SCRIPT' || echo "::warning::The worker's libraries could not be installed; see docs/deploy.md."
          set -euo pipefail
          cd "$1"
          [ -d venv ] || python3 -m venv venv
          venv/bin/pip install --quiet -r requirements.txt
          REMOTE_SCRIPT

      ########################################################
      # Permissions and migrations
      ########################################################

      - name: Set writable permissions
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          find writable -type d -exec chmod 775 {} \;
          find writable -type f -exec chmod 664 {} \;
          REMOTE_SCRIPT

      # Runs with the same PHP the website runs on (PHP_BIN, 8.5 by default),
      # not the server's default `php`.
      - name: Run database migrations
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          "$2" spark migrate --all
          REMOTE_SCRIPT

      # The scheduled jobs (audit D5): the block between "# BEGIN mentora jobs" and "# END mentora jobs" in the
      # site user's crontab is written from deploy/crontab.txt with this site's folder and PHP binary; nothing
      # else in the crontab is touched. Then every job is checked to be there, and a missing one fails the deploy.
      - name: Install the scheduled jobs
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE_SCRIPT' || { echo "::error::The scheduled jobs are not installed; see docs/server-setup.md section 6."; exit 1; }
          set -euo pipefail
          cd "$1"
          next=$(mktemp)
          err=$(mktemp)
          # Only "no crontab for <user>" means empty; any other failure to read it stops here, so the
          # site user's other lines are never lost to a crontab rewritten from nothing.
          if current=$(crontab -l 2> "$err"); then
            :
          elif grep -qi "no crontab for" "$err"; then
            current=""
          else
            cat "$err" >&2
            exit 1
          fi
          printf '%s\n' "$current" | "$2" spark jobs:crontab --no-header --site "$1" --php "$2" > "$next"
          crontab "$next"
          rm -f "$next" "$err"
          crontab -l | "$2" spark jobs:crontab --no-header --verify
          REMOTE_SCRIPT

      # The PHP-FPM pools revalidate files every 2 s (opcache.validate_timestamps),
      # so new code needs no FPM restart. The file cache is cleared so nothing
      # computed by the old code or schema is served. Not worth failing a
      # deploy over.
      - name: Clear the application cache
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE_SCRIPT' || echo "::warning::The cache could not be cleared; see docs/deploy.md."
          set -euo pipefail
          cd "$1"
          "$2" spark cache:clear
          REMOTE_SCRIPT

      ########################################################
      # Question-builder worker: restart (optional)
      ########################################################

      # The deploy users have no sudo for systemctl on the shared VPS, so this
      # first tries `sudo -n systemctl restart` (works if a sudoers rule was
      # added) and otherwise sends the worker SIGUSR1: it finishes its current
      # job, exits with status 75 and the unit's Restart=on-failure starts the
      # new code. It then waits for a new process and checks it stays up.
      # A warning, never a failure: a worker left on old code is fixed by hand
      # (docs/deploy.md), and the website does not depend on it.
      - name: Restart the question-builder worker
        if: env.QB_PATH != ''
        run: |
          ssh $SSH_OPTS "$REMOTE" bash -s -- "$QB_SERVICE" <<'REMOTE_SCRIPT' || echo "::warning::The worker '$QB_SERVICE' was not confirmed restarted; it may still run the old code. See docs/deploy.md."
          set -euo pipefail
          unit="$1"
          systemctl cat "$unit" > /dev/null 2>&1 || { echo "::error::No systemd unit named $unit. Set the QB_SERVICE variable or install the unit (docs/deploy.md)."; exit 1; }
          before=$(systemctl show "$unit" -p MainPID --value)
          if sudo -n systemctl restart "$unit" 2> /dev/null; then
            echo "Restarted $unit with systemctl."
          elif [ "$before" -gt 0 ]; then
            kill -USR1 "$before"
            echo "Asked $unit (pid $before) to restart itself."
          else
            echo "::error::$unit is not running and this user cannot start it."
            exit 1
          fi
          pid=0
          for _ in $(seq 1 30); do
            pid=$(systemctl show "$unit" -p MainPID --value)
            if [ "$pid" -gt 0 ] && [ "$pid" != "$before" ]; then break; fi
            sleep 2
          done
          if [ "$pid" -le 0 ] || [ "$pid" = "$before" ]; then
            echo "::error::$unit did not come back with a new process within a minute."
            exit 1
          fi
          sleep 10
          systemctl is-active --quiet "$unit" || { echo "::error::$unit stopped again after restarting."; journalctl -u "$unit" -n 15 --no-pager || true; exit 1; }
          echo "$unit is running as pid $pid."
          REMOTE_SCRIPT

      ########################################################
      # Health check
      ########################################################

      # CURL_TLS is "-k" only while TLS_INSECURE is true (a self-signed
      # certificate); with a real certificate the check verifies it.
      - name: Check the site is healthy
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl ${CURL_TLS:-} -fsS --max-time 15 "$HEALTH_URL" || true)
            echo "Attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site did not report healthy at $HEALTH_URL after deploying. The database backup from this deploy is in ~/backups on the server."
          exit 1

      ########################################################
      # Smoke test
      ########################################################

      # /health only proves the app reaches its database. This checks what a
      # visitor meets first: the login form, the built CSS and JS it links to,
      # and that anonymous visitors are sent to login (.github/scripts/smoke-test.php).
      - name: Smoke test the site
        run: php .github/scripts/smoke-test.php "$SITE_URL" ${SMOKE_TLS:-}

      ########################################################
      # If anything above failed
      ########################################################

      - name: Rollback instructions
        if: failure()
        run: |
          {
            echo "### The $DEPLOY_ENV deploy failed"
            echo
            echo "The newest database backup is in \`~/backups\` on the server (made before anything changed)."
            echo
            echo "- **Code**: re-run the previous good version. Production: Actions > the production workflow > Run workflow > choose the previous tag. Staging: revert the merged PR."
            echo "- **Database**: a failed migration is not undone by redeploying code. Restore the backup only if data was damaged (docs/deploy.md, \"Restoring a database backup\")."
            echo "- The failed step is marked in the job log above."
          } >> "$GITHUB_STEP_SUMMARY"
