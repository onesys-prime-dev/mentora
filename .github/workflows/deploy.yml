name: 🚀 Deploy Mentora

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: 22
      DEPLOY_PATH: /home/mentora/htdocs/mentora.srv1404227.hstgr.cloud

    steps:
      ########################################################
      # Checkout
      ########################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ########################################################
      # PHP
      ########################################################

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, mysqli, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      ########################################################
      # NODE
      ########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: |
          rm -rf node_modules
          npm install

      ########################################################
      # Debug
      ########################################################

      - name: Debug Node environment
        run: |
          node -v
          npm -v
          npm ls rolldown
          npm ls @rolldown/binding-linux-x64-gnu

      - name: Verify Rolldown native binding
        run: |
          ls -la node_modules/@rolldown
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('Rolldown binding loaded successfully.')"

      ########################################################
      # Build
      ########################################################

      - name: Build Vite assets
        run: npm run build

      - name: Verify build output
        run: |
          test -f public/build/.vite/manifest.json
          ls -R public/build

      ########################################################
      # SSH
      ########################################################

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_PRIVATE_KEY }}

      ########################################################
      # Deploy
      ########################################################

      - name: Deploy application
        run: |
          rsync -az --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude="writable" \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}

      ########################################################
      # Permissions
      ########################################################

      - name: Set writable permissions
        run: |
          ssh -p ${SSH_PORT} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << EOF

          cd ${DEPLOY_PATH}

          find writable -type d -exec chmod 775 {} \;
          find writable -type f -exec chmod 664 {} \;

          EOF