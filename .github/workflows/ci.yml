name: CI

# Runs on every pull request into main. A push to main is covered by
# deploy.yml, which calls this workflow (workflow_call) and deploys only if it
# passes. The job named "CI passed" at the bottom is the single result to look
# at (and the one to require in a branch ruleset).

on:
  pull_request:
    branches: [main]
  workflow_call:

# A newer push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks reads the PR's commit list through the API on pull_request runs.
  pull-requests: read

jobs:
  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor in composer.json (and the local dev version);
        # 8.5 is what the staging site's PHP-FPM actually runs.
        php: ["8.2", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find app tests public -name '*.php' -print0)
          php -l spark > /dev/null || status=1
          exit $status

  composer:
    name: Composer (validate, install, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysqli, zip
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

  # PHPStan (phpstan.neon). Problems that already existed are recorded in
  # phpstan-baseline.neon and tolerated; anything new fails the build. When you
  # fix baselined code, shrink the baseline (see docs/ci-cd.md); never grow it
  # to get a build through.
  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysqli, zip
          coverage: none
          tools: composer

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  tests:
    name: Tests on MySQL (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage is measured on 8.2 only (pcov); 8.5 just has to pass.
          - php: "8.2"
            coverage: pcov
            phpunit_args: --coverage-text
          - php: "8.5"
            coverage: none
            phpunit_args: --no-coverage
    services:
      # Same major version as the staging server's MySQL (8.4). The tests
      # connect as root with no password (the defaults in app/Config/Database.php),
      # which is fine for a throwaway container that only lives for this job.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: mentora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is the merge of the PR into main, so its
          # first parent (HEAD^1) is main; two commits are enough to diff them.
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: ${{ matrix.coverage }}
          tools: composer

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The same command the server runs, on an empty database. If any
      # migration (App or Shield) is broken on a fresh install, it fails here.
      #
      # spark ignores `-g tests`, so the default connection is pointed at the
      # test database through environment variables instead. spark also exits
      # 0 when it cannot connect, so the next check proves the migrations
      # really ran: the history table must hold at least one row per App
      # migration file.
      - name: Migrate an empty database (as the server does)
        run: |
          # A database of its own: spark records the migration history under
          # the "default" group, while PHPUnit migrates the "tests" group, so
          # sharing mentora_test would make PHPUnit re-run every migration.
          php -r '(new mysqli("127.0.0.1", "root", ""))->query("CREATE DATABASE mentora_spark_check");'

          env database.default.hostname=127.0.0.1 \
              database.default.database=mentora_spark_check \
              database.default.username=root \
              database.default.password= \
              database.default.DBDriver=MySQLi \
              php spark migrate --all

          php -r '
            $db = new mysqli("127.0.0.1", "root", "", "mentora_spark_check");
            $ran = (int) $db->query("SELECT COUNT(*) AS c FROM migrations")->fetch_assoc()["c"];
            $files = count(glob("app/Database/Migrations/*.php"));
            echo "{$ran} migrations recorded, {$files} App migration files\n";
            exit($ran >= $files ? 0 : 1);
          '

      # Why does the 8.5 leg run slower than 8.2? Print what differs between
      # the legs so the logs can be compared side by side.
      - name: PHP runtime diagnostics
        run: |
          php -r '
            echo "PHP ", PHP_VERSION, "\n";
            foreach (["opcache.enable_cli", "opcache.jit", "opcache.jit_buffer_size", "memory_limit", "error_reporting"] as $k) {
              echo $k, " = ", var_export(ini_get($k), true), "\n";
            }
            echo "opcache loaded = ", extension_loaded("Zend OPcache") ? "yes" : "no", "\n";
            echo "xdebug loaded  = ", extension_loaded("xdebug") ? "yes" : "no", "\n";
            echo "pcov loaded    = ", extension_loaded("pcov") ? "yes" : "no", "\n";
          '
          php -m | tr '\n' ' '; echo

      - name: Run tests
        shell: bash
        run: vendor/bin/phpunit ${{ matrix.phpunit_args }} | tee phpunit-output.txt

      # The same suite with every setting filled in (audit 14.2): a test that only passes while a setting
      # is unset would pass above and fail on a developer's machine with a full .env. Once, on the leg
      # without coverage.
      - name: Run the tests with every setting filled in
        if: matrix.coverage == 'none'
        shell: bash
        run: |
          cp tests/_support/ci-full.env .env
          vendor/bin/phpunit --no-coverage
          rm .env

      # Overall line coverage may never drop below .github/coverage-floor.
      # Raise that number in the same PR that adds tests; never lower it.
      - name: Check the coverage floor
        if: matrix.coverage == 'pcov'
        run: php .github/scripts/check-coverage.php phpunit-output.txt .github/coverage-floor

      # The lines this pull request adds or changes under app/ must be covered
      # (minimum in .github/diff-coverage-threshold). Only meaningful on a pull
      # request, where there is a base to diff against; a push to main has
      # already passed this check on its way in.
      - name: Check coverage of the changed lines
        if: matrix.coverage == 'pcov' && github.event_name == 'pull_request'
        run: |
          git diff -U0 HEAD^1 HEAD -- app > changes.diff
          php .github/scripts/check-diff-coverage.php build/logs/clover.xml changes.diff .github/diff-coverage-threshold

      - name: Upload coverage report
        if: always() && matrix.coverage == 'pcov'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/logs
          if-no-files-found: ignore

  assets:
    name: Frontend build and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json says, so a green run
      # here means the lockfile is sound on Linux (where the server builds).
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # ESLint (eslint.config.js). Problems that already existed are recorded
      # in eslint-suppressions.json and tolerated; anything new fails, and so
      # does a suppression that no longer applies (shrink it: see ci-cd.md).
      - name: Lint the browser code
        run: npm run lint

      # Unit tests for the browser code in resources/js (jsdom; no PHP,
      # database or build needed).
      - name: Run frontend unit tests
        run: npm test

      - name: Build Vite assets
        run: npm run build

      - name: Verify build output
        run: test -f public/build/.vite/manifest.json

  # Browser end-to-end tests (Playwright, tests/e2e). tests/e2e/support/serve.js
  # resets a database of its own on the MySQL service below, seeds the demo
  # data, serves the app and the tests drive Chromium against it. The cases they
  # automate are in docs/test-cases/.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_DATABASE: mentora_e2e
      E2E_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
          tools: composer

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # The pages load the built CSS and JS.
      - name: Build Vite assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npm run e2e

      - name: Show the app's own errors
        if: failure()
        run: tail -n 80 writable/logs/log-*.log 2>/dev/null || echo "no app log written"

      # The report has screenshots and traces; writable/logs has the app's own errors.
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            writable/logs/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  question-builder:
    name: Question builder service (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-question-builder-service/requirements-dev.txt

      - name: Install
        working-directory: python-question-builder-service
        run: pip install -r requirements-dev.txt

      # No model and no network: the service's own logic only.
      - name: Test
        working-directory: python-question-builder-service
        run: python -m pytest -q

  ci-passed:
    name: CI passed
    if: always()
    needs: [php-syntax, composer, static-analysis, tests, assets, e2e, secrets, question-builder]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
